name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 benchmark.py --rows 2000 --customers 100 --requests 10 --repeats 2 --output results/ci
